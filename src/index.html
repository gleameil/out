        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Montserrat&family=EB+Garamond&family=Rock+Salt&family=Reenie+Beanie&family=Nanum+Brush+Script&family=Indie+Flower&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">

        <link rel="manifest" href="assets/site.webmanifest">
        <script src="index.ts" type="module" defer></script>
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "CreativeWork",
            "name": "Of Evernost: The Window",
            "url": "https://gleameil.github.io/out/",
            "description": "A browser-based net art piece by Meg Moseman rendering what lies beyond the window of Jennie's room in Evernost. The experience is entirely determined by calendar date and time of day: six weather types — procedural night skies, poemstorms, wordstorms, philosophical snowsight dialogues, the cloudy room, and clear autofiction — rotate through the Evernostian January schedule. Time is navigable; what you encounter depends on when you look.",
            "author": {
                "@type": "Person",
                "name": "Meg Moseman",
                "url": "https://megmoseman.com"
            },
            "genre": ["net art", "interactive fiction", "experimental literature", "hypertext poetry"],
            "accessibilityFeature": ["readingOrder"],
            "accessibilityHazard": "noFlashingHazard",
            "accessMode": ["visual", "textual", "auditory"],
            "accessModeSufficient": ["textual"],
            "abstract": "The window of Jennie's room, companion piece to /in/. Not a space to inhabit but a sky to look at — weather-driven, time-indexed, built from poetry, prose, dialogue, and procedural visuals. Part of Of Evernost by Meg Moseman.",
            "isPartOf": {
                "@type": "WebSite",
                "name": "Of Evernost",
                "url": "https://gleameil.github.io"
            },
            "workExample": {
                "@type": "CreativeWork",
                "name": "Of Evernost: Out — Reading Layer",
                "url": "https://gleameil.github.io/out/reading-layer/",
                "description": "Text-accessible version of the window and weather system, with the full content of all weather types presented in reading order with contextual notes on the live experience."
            }
        }
        </script>
        <title>Out</title>
    </head>
    <noscript>
